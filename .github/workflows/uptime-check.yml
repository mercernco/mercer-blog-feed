name: Site uptime check
on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check mercernco.com pages
        run: |
          for url in "https://mercernco.com/" "https://mercernco.com/dealer" "https://mercernco.com/blog" "https://quote.mercernco.com/"; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 30 "$url")
            echo "$url -> $code"
            if [ "$code" != "200" ]; then echo "FAILED: $url"; exit 1; fi
          done
